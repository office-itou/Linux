set default="0"
set timeout=":_MENU_TOUT_:"

if [ "x${font}" = "x" ] ; then
  if [ "x${feature_default_font_path}" = "xy" ] ; then
    font="unicode"
  else
    font="${prefix}/fonts/font.pf2"
  fi
fi
export font

if loadfont "$font" ; then
# set lang="ja_JP"
# export lang
  set gfxmode=:_MENU_RESO_:
  set gfxpayload="keep"
  export gfxmode
  export gfxpayload
  if [ "${grub_platform}" = "efi" ]; then
    insmod efi_gop
    insmod efi_uga
  else
    insmod vbe
    insmod vga
  fi
  insmod video_bochs
  insmod video_cirrus
  insmod gfxterm
  insmod gettext
  insmod png
  terminal_output gfxterm
fi

#set timeout_style=menu
#set color_normal=light-gray/black
#set color_highlight=white/dark-gray
#export color_normal
#export color_highlight

set theme=:_AUTO_THME_:
export theme

#insmod play
#play 960 440 1 0 4 440 1

menuentry 'Automatic installation' {
  echo 'Loading :_TITL_TEXT_: ...'
  set gfxpayload="keep"
  set background_color="black"
  set hostname=":_NWRK_HOST_:"
  set ethrname=":_NICS_NAME_:"
  set ipv4addr=":_IPV4_CIDR_:"
  set ipv4mask=":_IPV4_MASK_:"
  set ipv4gway=":_IPV4_GWAY_:"
  set ipv4nsvr=":_IPV4_NSVR_:"
  set srvraddr=":_SRVR_TGET_:"
  set autoinst=":_OPTN_AUTO_:"
  set language=":_OPTN_LANG_:"
  set networks=":_OPTN_NWRK_:"
  set otheropt=":_OPTN_OTHR_:"
  set options="${autoinst} ${language} ${networks} ${otheropt}"
  if [ "${grub_platform}" = "efi" ]; then rmmod tpm; fi
  echo 'Loading boot files ...'
  linux  :_PATH_FKNL_: ${options} --- quiet vga=:_MENU_MODE_:
  initrd :_PATH_FIRD_:
}

